{% extends "base.html" %}
{% block title %}{{ acao }} Curso — EduDataManager{% endblock %}
{% block content %}
<div class="page-header">
  <h2><i class="bi bi-journal-bookmark-fill me-2" style="color:#ca8a04"></i>{{ acao }} Curso</h2>
  <a href="{{ url_for('routes.cursos') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
</div>
<div class="form-card">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Nome do Curso *</label>
        <input type="text" name="nome_curso" class="form-control" value="{{ curso.nome_curso if curso else '' }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Carga Horária (h) *</label>
        <input type="number" name="carga_horaria" class="form-control" value="{{ curso.carga_horaria if curso else '' }}" required>
      </div>
      <div class="col-12">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="3">{{ curso.descricao if curso else '' }}</textarea>
      </div>
      <div class="col-12 pt-2">
        <button type="submit" class="btn btn-warning px-4"><i class="bi bi-check2 me-1"></i>Salvar</button>
        <a href="{{ url_for('routes.cursos') }}" class="btn btn-outline-secondary ms-2">Cancelar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
