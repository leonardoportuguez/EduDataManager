<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EduDataManager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-mortarboard-fill me-2"></i>
    <span>EduDataManager</span>
  </div>
  <nav class="sidebar-nav">
    <a href="{{ url_for('routes.dashboard') }}" class="nav-link {% if request.endpoint == 'routes.dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="{{ url_for('routes.alunos') }}" class="nav-link {% if 'aluno' in request.endpoint %}active{% endif %}">
      <i class="bi bi-people-fill"></i> Alunos
    </a>
    <a href="{{ url_for('routes.professores') }}" class="nav-link {% if 'professor' in request.endpoint %}active{% endif %}">
      <i class="bi bi-person-badge-fill"></i> Professores
    </a>
    <a href="{{ url_for('routes.cursos') }}" class="nav-link {% if 'curso' in request.endpoint %}active{% endif %}">
      <i class="bi bi-journal-bookmark-fill"></i> Cursos
    </a>
    <a href="{{ url_for('routes.disciplinas') }}" class="nav-link {% if 'disciplina' in request.endpoint %}active{% endif %}">
      <i class="bi bi-book-fill"></i> Disciplinas
    </a>
    <a href="{{ url_for('routes.notas') }}" class="nav-link {% if 'nota' in request.endpoint %}active{% endif %}">
      <i class="bi bi-clipboard2-check-fill"></i> Notas
    </a>
    <div class="sidebar-divider"></div>
    <a href="{{ url_for('routes.lixeira_alunos_route') }}" class="nav-link">
      <i class="bi bi-trash3-fill"></i> Lixeira
    </a>
    <a href="{{ url_for('routes.logout') }}" class="nav-link text-danger">
      <i class="bi bi-box-arrow-left"></i> Sair
    </a>
  </nav>
</div>

<!-- Conteúdo principal -->
<div class="main-content">
  <div class="topbar">
    <button class="btn btn-sm btn-outline-secondary" id="toggleSidebar">
      <i class="bi bi-list"></i>
    </button>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-muted small">
        <i class="bi bi-person-circle me-1"></i>
        {{ session.get('usuario_nome', 'Usuário') }}
      </span>
    </div>
  </div>

  <div class="page-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById("toggleSidebar").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("collapsed");
    document.querySelector(".main-content").classList.toggle("expanded");
  });
</script>
</body>
</html>
