{% extends "base.html" %}
{% block title %}{{ acao }} Disciplina — EduDataManager{% endblock %}
{% block content %}
<div class="page-header">
  <h2><i class="bi bi-book-fill me-2" style="color:#db2777"></i>{{ acao }} Disciplina</h2>
  <a href="{{ url_for('routes.disciplinas') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
</div>
<div class="form-card">
  <form method="POST">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Nome da Disciplina *</label>
        <input type="text" name="nome_disciplina" class="form-control" value="{{ disciplina.nome_disciplina if disciplina else '' }}" required>
      </div>
      <div class="col-md-8">
        <label class="form-label">Curso *</label>
        <select name="curso_id" class="form-select" required>
          <option value="">— Selecione —</option>
          {% for c in cursos %}
            <option value="{{ c.id }}" {% if disciplina and disciplina.curso_id == c.id %}selected{% endif %}>{{ c.nome_curso }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Carga Horária (h)</label>
        <input type="number" name="carga_horaria" class="form-control" value="{{ disciplina.carga_horaria if disciplina else '' }}">
      </div>
      <div class="col-12 pt-2">
        <button type="submit" class="btn px-4" style="background:#db2777;color:#fff"><i class="bi bi-check2 me-1"></i>Salvar</button>
        <a href="{{ url_for('routes.disciplinas') }}" class="btn btn-outline-secondary ms-2">Cancelar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
