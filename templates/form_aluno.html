{% extends "base.html" %}
{% block title %}{{ acao }} Aluno — EduDataManager{% endblock %}
{% block content %}

<div class="page-header">
  <h2><i class="bi bi-person-fill me-2 text-primary"></i>{{ acao }} Aluno</h2>
  <a href="{{ url_for('routes.alunos') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Voltar
  </a>
</div>

<div class="form-card">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Nome completo *</label>
        <input type="text" name="nome" class="form-control"
               value="{{ aluno.nome if aluno else '' }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">CPF *</label>
        <input type="text" name="cpf" class="form-control" maxlength="14"
               placeholder="000.000.000-00"
               value="{{ aluno.cpf if aluno else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">E-mail *</label>
        <input type="email" name="email" class="form-control"
               value="{{ aluno.email if aluno else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control"
               value="{{ aluno.telefone if aluno else '' }}">
      </div>
      <div class="col-md-8">
        <label class="form-label">Curso</label>
        <select name="curso" class="form-select">
          <option value="">— Selecione —</option>
          {% for c in cursos %}
            <option value="{{ c.nome_curso }}"
              {% if aluno and aluno.curso == c.nome_curso %}selected{% endif %}>
              {{ c.nome_curso }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          {% for s in ['ativo','inativo','formado','trancado'] %}
            <option value="{{ s }}"
              {% if aluno and aluno.status == s %}selected{% endif %}>
              {{ s.capitalize() }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 pt-2">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check2 me-1"></i>Salvar
        </button>
        <a href="{{ url_for('routes.alunos') }}" class="btn btn-outline-secondary ms-2">Cancelar</a>
      </div>
    </div>
  </form>
</div>

{% endblock %}
